<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postest 2 - Fungsi Kuadrat</title>
</head>
<body>
    <script>
        
        function kuadrat(bilangan) {
            return bilangan * bilangan;
        }

       
        let hasil = kuadrat(7);
        console.log("Kuadrat dari 7 adalah " + hasil);
    </script>
</body>
