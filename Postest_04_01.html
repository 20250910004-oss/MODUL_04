<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postest 1 - Perbedaan var, let, dan const</title>
</head>
<body>
    <script>
       
        if (true) {
            var a = "var di dalam blok";
            let b = "let di dalam blok";
            const c = "const di dalam blok";
        }

        
        console.log("Nilai a: " + a);

        
        try {
            console.log(b);
        } catch (e) {
            console.log("Error let: " + e.message);
        }

        try {
            console.log(c);
        } catch (e) {
            console.log("Error const: " + e.message);
        }
    </script>
</body>
</html>
